<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад ГСМ — учёт прихода и расхода</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f1418;
    --panel:#171e25;
    --panel-2:#1e2730;
    --text:#e7edf2;
    --muted:#8fa0ad;
    --border:#2a3540;
    --shadow: 0 2px 8px rgba(0,0,0,.35);

    --ai92:#f0b429;
    --ai92-bg:#3a2f10;
    --ai95:#ff7a33;
    --ai95-bg:#3a2413;
    --dt:#2dd4bf;
    --dt-bg:#123331;

    --in:#3ecf6a;
    --in-bg:#123a1f;
    --out:#f0554d;
    --out-bg:#3a1414;

    --accent:#4fa3ff;
    --accent-2:#7db8ff;
    --danger:#f0554d;
    --danger-2:#ff756c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;
  }
  header.topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 20px; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  header.topbar h1{font-size:18px; margin:0;}
  header.topbar .sub{color:var(--muted); font-size:12.5px; margin-top:2px;}

  main{max-width:1200px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:18px;}

  .banner-critical{
    display:none;
    background:var(--out-bg); border:1px solid var(--danger); color:var(--danger-2);
    border-radius:10px; padding:12px 16px; font-size:14px; font-weight:600;
    align-items:center; gap:8px;
  }
  .banner-critical.show{display:flex;}

  .tanks{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:820px){ .tanks{grid-template-columns:1fr;} }

  .tank{
    position:relative; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow); overflow:hidden;
  }
  .tank.critical{ border-color:var(--danger); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,85,77,.55); }
    50%{ box-shadow:0 0 0 8px rgba(240,85,77,0); }
  }
  .tank .fuel-name{font-size:15px; font-weight:700; letter-spacing:.3px;}
  .tank[data-fuel="ai92"] .fuel-name{color:var(--ai92);}
  .tank[data-fuel="ai95"] .fuel-name{color:var(--ai95);}
  .tank[data-fuel="dt"] .fuel-name{color:var(--dt);}
  .tank.critical .fuel-name, .tank.critical .volume{color:var(--danger) !important;}

  .tank .volume{font-size:30px; font-weight:800; margin:8px 0 2px;}
  .tank .volume small{font-size:14px; font-weight:600; color:var(--muted);}

  .tank .badge-dead{
    display:none; margin:4px 0 10px; font-size:11.5px; font-weight:700;
    background:var(--danger); color:#fff; padding:3px 8px; border-radius:999px;
  }
  .tank.critical .badge-dead{display:inline-block;}

  .gauge{ height:14px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); overflow:hidden; margin:10px 0 12px; }
  .gauge > div{ height:100%; border-radius:999px; transition:width .25s ease; }
  .tank[data-fuel="ai92"] .gauge > div{background:var(--ai92);}
  .tank[data-fuel="ai95"] .gauge > div{background:var(--ai95);}
  .tank[data-fuel="dt"] .gauge > div{background:var(--dt);}
  .tank.critical .gauge > div{background:var(--danger);}

  .tank .settings-row{display:flex; gap:10px; font-size:12px; color:var(--muted);}
  .tank .settings-row label{display:flex; flex-direction:column; gap:3px; flex:1;}
  .tank .settings-row input{width:100%;}

  input, select{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 9px; font-size:13px; font-family:inherit;
  }
  input:focus, select:focus{outline:1px solid var(--accent);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .panel h2{margin:0 0 12px; font-size:15px;}

  .forms-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:820px){ .forms-row{grid-template-columns:1fr;} }

  .op-form{border-top:3px solid transparent;}
  .op-form.in{border-top-color:var(--in);}
  .op-form.out{border-top-color:var(--out);}
  .op-form .fields{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .op-form label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted);}
  .op-form label.full{grid-column:1/-1;}
  .op-form button{
    margin-top:12px; width:100%; border:none; border-radius:9px; padding:10px; font-size:14px;
    font-weight:700; cursor:pointer; color:#0f1418;
  }
  .op-form.in button{background:var(--in);}
  .op-form.out button{background:var(--out);}

  .day-report{display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:start;}
  @media (max-width:700px){ .day-report{grid-template-columns:1fr;} }
  .day-report .lists{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){ .day-report .lists{grid-template-columns:1fr;} }
  .day-list h3{font-size:13px; margin:0 0 8px;}
  .day-list.in h3{color:var(--in);}
  .day-list.out h3{color:var(--out);}
  .day-list table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .day-list th, .day-list td{padding:5px 6px; border-bottom:1px solid var(--border); text-align:left;}
  .day-list tfoot td{font-weight:700; border-bottom:none; border-top:1px solid var(--border);}
  .empty-note{color:var(--muted); font-size:12.5px; padding:6px 0;}

  .export-row{display:flex; gap:10px; flex-wrap:wrap; align-items:end;}
  .export-row label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted);}
  .export-row button{
    background:var(--accent); color:#0f1418; border:none; border-radius:9px; padding:10px 16px;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .export-row button:hover{background:var(--accent-2);}

  .filters{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:12px;}
  .filters label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted);}
  .filters button.reset{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 12px; cursor:pointer; font-size:12.5px;
  }

  table.journal{width:100%; border-collapse:collapse; font-size:13px;}
  table.journal thead th{
    text-align:left; padding:8px 8px; border-bottom:1px solid var(--border); color:var(--muted);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  table.journal thead th.sortable:hover{color:var(--text);}
  table.journal thead th .arrow{font-size:10px; margin-left:3px;}
  table.journal tbody td{padding:8px 8px; border-bottom:1px solid var(--border);}
  table.journal tbody tr:hover{background:var(--panel-2);}
  .tag{padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;}
  .tag.in{background:var(--in-bg); color:var(--in);}
  .tag.out{background:var(--out-bg); color:var(--out);}
  .fuel-tag{padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;}
  .fuel-tag.ai92{background:var(--ai92-bg); color:var(--ai92);}
  .fuel-tag.ai95{background:var(--ai95-bg); color:var(--ai95);}
  .fuel-tag.dt{background:var(--dt-bg); color:var(--dt);}
  .del-btn{
    background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px;
    padding:4px 8px; cursor:pointer; font-size:12px;
  }
  .del-btn:hover{border-color:var(--danger); color:var(--danger);}
  .table-wrap{overflow-x:auto;}
  .journal-empty{color:var(--muted); padding:16px 0; text-align:center; font-size:13px;}

  footer{text-align:center; color:var(--muted); font-size:11.5px; padding:20px 0 30px;}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>⛽ Склад ГСМ</h1>
    <div class="sub">Учёт прихода и расхода нефтепродуктов</div>
  </div>
</header>

<main>
  <div id="banner" class="banner-critical">⚠️ <span id="bannerText"></span></div>

  <section class="tanks" id="tanks"></section>

  <section class="forms-row">
    <form class="panel op-form in" id="formIn">
      <h2 style="color:var(--in)">➕ Приход НП</h2>
      <div class="fields">
        <label>Дата прихода
          <input type="date" name="date" required>
        </label>
        <label>Вид НП
          <select name="fuel" required>
            <option value="ai92">АИ-92</option>
            <option value="ai95">АИ-95</option>
            <option value="dt">ДТ</option>
          </select>
        </label>
        <label>Объём, л
          <input type="number" name="volume" min="0.01" step="0.01" required>
        </label>
        <label>Поставщик / документ основания
          <input type="text" name="party" required>
        </label>
      </div>
      <button type="submit">Добавить приход</button>
    </form>

    <form class="panel op-form out" id="formOut">
      <h2 style="color:var(--out)">➖ Расход НП</h2>
      <div class="fields">
        <label>Дата расхода
          <input type="date" name="date" required>
        </label>
        <label>Вид НП
          <select name="fuel" required>
            <option value="ai92">АИ-92</option>
            <option value="ai95">АИ-95</option>
            <option value="dt">ДТ</option>
          </select>
        </label>
        <label>Объём, л
          <input type="number" name="volume" min="0.01" step="0.01" required>
        </label>
        <label>Объект назначения
          <input type="text" name="party" required>
        </label>
      </div>
      <button type="submit">Добавить расход</button>
    </form>
  </section>

  <section class="panel day-report">
    <div>
      <h2>Отчёт за сутки</h2>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);">
        Дата
        <input type="date" id="dayDate">
      </label>
    </div>
    <div class="lists">
      <div class="day-list in">
        <h3>Приходы за день</h3>
        <div id="dayIn"></div>
      </div>
      <div class="day-list out">
        <h3>Расходы за день</h3>
        <div id="dayOut"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Excel-отчёт за период</h2>
    <div class="export-row">
      <label>Дата с
        <input type="date" id="exportFrom">
      </label>
      <label>Дата по
        <input type="date" id="exportTo">
      </label>
      <button id="exportBtn" type="button">⬇ Скачать отчёт .xlsx</button>
    </div>
  </section>

  <section class="panel">
    <h2>Журнал операций</h2>
    <div class="filters">
      <label>Тип
        <select id="fType">
          <option value="all">Все</option>
          <option value="in">Приход</option>
          <option value="out">Расход</option>
        </select>
      </label>
      <label>Вид НП
        <select id="fFuel">
          <option value="all">Все</option>
          <option value="ai92">АИ-92</option>
          <option value="ai95">АИ-95</option>
          <option value="dt">ДТ</option>
        </select>
      </label>
      <label>Дата с
        <input type="date" id="fFrom">
      </label>
      <label>Дата по
        <input type="date" id="fTo">
      </label>
      <label style="flex:1; min-width:160px;">Поиск по контрагенту
        <input type="text" id="fSearch" placeholder="Поставщик / объект">
      </label>
      <button class="reset" id="fReset" type="button">Сбросить фильтры</button>
    </div>
    <div class="table-wrap">
      <table class="journal">
        <thead>
          <tr>
            <th class="sortable" data-sort="date">Дата <span class="arrow" id="arrowDate"></span></th>
            <th>Тип</th>
            <th>Вид НП</th>
            <th class="sortable" data-sort="volume">Объём, л <span class="arrow" id="arrowVolume"></span></th>
            <th>Контрагент</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="journalBody"></tbody>
      </table>
      <div class="journal-empty" id="journalEmpty" style="display:none;">Операций не найдено</div>
    </div>
  </section>

  <footer>Данные хранятся локально в этом браузере (localStorage).</footer>
</main>

<script>
(function(){
  "use strict";

  var STORAGE_OPS = "sklad_gsm_v1_operations";
  var STORAGE_SETTINGS = "sklad_gsm_v1_settings";

  var FUELS = [
    {key:"ai92", label:"АИ-92"},
    {key:"ai95", label:"АИ-95"},
    {key:"dt",   label:"ДТ"}
  ];
  var FUEL_LABEL = {ai92:"АИ-92", ai95:"АИ-95", dt:"ДТ"};

  var DEFAULT_SETTINGS = {
    ai92:{capacity:10000, deadLevel:500},
    ai95:{capacity:10000, deadLevel:500},
    dt:  {capacity:15000, deadLevel:800}
  };

  // ---------- state ----------
  var operations = loadOperations();
  var settings = loadSettings();

  var sortState = {field:"date", dir:"desc"};

  function loadOperations(){
    try{
      var raw = localStorage.getItem(STORAGE_OPS);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveOperations(){
    localStorage.setItem(STORAGE_OPS, JSON.stringify(operations));
  }
  function loadSettings(){
    try{
      var raw = localStorage.getItem(STORAGE_SETTINGS);
      var parsed = raw ? JSON.parse(raw) : {};
      var out = {};
      FUELS.forEach(function(f){
        var d = DEFAULT_SETTINGS[f.key];
        var s = parsed[f.key] || {};
        out[f.key] = {
          capacity: (typeof s.capacity === "number" && s.capacity > 0) ? s.capacity : d.capacity,
          deadLevel: (typeof s.deadLevel === "number" && s.deadLevel >= 0) ? s.deadLevel : d.deadLevel
        };
      });
      return out;
    }catch(e){
      return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    }
  }
  function saveSettings(){
    localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings));
  }

  function uid(){
    return "op_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
  }

  function fmtNum(n){
    return Number(n).toLocaleString("ru-RU", {maximumFractionDigits:2});
  }
  function isoToRu(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length !== 3) return iso;
    return p[2] + "." + p[1] + "." + p[0];
  }
  function todayIso(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function monthStartIso(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-01";
  }
  function monthEndIso(){
    var d = new Date();
    var last = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return last.getFullYear() + "-" + String(last.getMonth()+1).padStart(2,"0") + "-" + String(last.getDate()).padStart(2,"0");
  }

  function stockOf(fuelKey, uptoIsoExclusive){
    // sum of in - sum of out for a fuel, optionally only operations with date < uptoIsoExclusive
    var sum = 0;
    for(var i=0;i<operations.length;i++){
      var op = operations[i];
      if(op.fuel !== fuelKey) continue;
      if(uptoIsoExclusive && !(op.date < uptoIsoExclusive)) continue;
      sum += (op.type === "in" ? op.volume : -op.volume);
    }
    return sum;
  }

  function stockAsOf(fuelKey, uptoIsoInclusive){
    var sum = 0;
    for(var i=0;i<operations.length;i++){
      var op = operations[i];
      if(op.fuel !== fuelKey) continue;
      if(uptoIsoInclusive && !(op.date <= uptoIsoInclusive)) continue;
      sum += (op.type === "in" ? op.volume : -op.volume);
    }
    return sum;
  }

  // ---------- render: tanks ----------
  var tanksEl = document.getElementById("tanks");
  function renderTanks(){
    tanksEl.innerHTML = "";
    var criticalList = [];

    FUELS.forEach(function(f){
      var s = settings[f.key];
      var stock = stockOf(f.key, null);
      var pct = s.capacity > 0 ? Math.max(0, Math.min(100, (stock / s.capacity) * 100)) : 0;
      var critical = stock <= s.deadLevel;
      if(critical) criticalList.push(f.label);

      var el = document.createElement("div");
      el.className = "tank" + (critical ? " critical" : "");
      el.setAttribute("data-fuel", f.key);
      el.innerHTML =
        '<div class="fuel-name">' + f.label + '</div>' +
        '<div class="badge-dead">Достигнут мёртвый остаток</div>' +
        '<div class="volume">' + fmtNum(stock) + ' <small>л</small></div>' +
        '<div class="gauge"><div style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '<div class="settings-row">' +
          '<label>Вместимость, л<input type="number" min="1" step="1" data-role="capacity" value="' + s.capacity + '"></label>' +
          '<label>Мёртвый остаток, л<input type="number" min="0" step="1" data-role="deadlevel" value="' + s.deadLevel + '"></label>' +
        '</div>';

      var capInput = el.querySelector('[data-role="capacity"]');
      var deadInput = el.querySelector('[data-role="deadlevel"]');
      capInput.addEventListener("change", function(){
        var v = parseFloat(capInput.value);
        if(!isNaN(v) && v > 0){
          settings[f.key].capacity = v;
          saveSettings();
          renderTanks();
        }
      });
      deadInput.addEventListener("change", function(){
        var v = parseFloat(deadInput.value);
        if(!isNaN(v) && v >= 0){
          settings[f.key].deadLevel = v;
          saveSettings();
          renderTanks();
        }
      });

      tanksEl.appendChild(el);
    });

    var banner = document.getElementById("banner");
    if(criticalList.length){
      banner.classList.add("show");
      document.getElementById("bannerText").textContent =
        "Мёртвый остаток достигнут: " + criticalList.join(", ");
    }else{
      banner.classList.remove("show");
    }
  }

  // ---------- forms: add operations ----------
  function initForm(formId, type){
    var form = document.getElementById(formId);
    var dateInput = form.querySelector('input[name="date"]');
    dateInput.value = todayIso();

    form.addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(form);
      var date = fd.get("date");
      var fuel = fd.get("fuel");
      var volume = parseFloat(fd.get("volume"));
      var party = (fd.get("party") || "").trim();

      if(!date || !fuel || isNaN(volume) || volume <= 0 || !party) return;

      operations.push({
        id: uid(),
        type: type,
        fuel: fuel,
        date: date,
        volume: volume,
        party: party
      });
      saveOperations();

      form.reset();
      dateInput.value = todayIso();

      renderTanks();
      renderJournal();
      renderDayReport();
    });
  }

  // ---------- day report ----------
  var dayDateEl = document.getElementById("dayDate");
  function renderDayReport(){
    var date = dayDateEl.value || todayIso();
    var ins = operations.filter(function(o){ return o.type === "in" && o.date === date; });
    var outs = operations.filter(function(o){ return o.type === "out" && o.date === date; });

    document.getElementById("dayIn").innerHTML = renderDayList(ins, "Поставщик");
    document.getElementById("dayOut").innerHTML = renderDayList(outs, "Объект");
  }
  function renderDayList(list, partyLabel){
    if(!list.length) return '<div class="empty-note">Нет операций за эту дату</div>';
    var total = list.reduce(function(s,o){ return s + o.volume; }, 0);
    var rows = list.map(function(o){
      return '<tr><td>' + FUEL_LABEL[o.fuel] + '</td><td>' + fmtNum(o.volume) + '</td><td>' + escapeHtml(o.party) + '</td></tr>';
    }).join("");
    return '<table><thead><tr><th>Вид НП</th><th>Объём, л</th><th>' + partyLabel + '</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td colspan="2">Итого: ' + fmtNum(total) + ' л</td><td></td></tr></tfoot></table>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------- journal: filters + sort + render ----------
  var fType = document.getElementById("fType");
  var fFuel = document.getElementById("fFuel");
  var fFrom = document.getElementById("fFrom");
  var fTo = document.getElementById("fTo");
  var fSearch = document.getElementById("fSearch");
  var journalBody = document.getElementById("journalBody");
  var journalEmpty = document.getElementById("journalEmpty");

  function getFilteredSorted(){
    var type = fType.value;
    var fuel = fFuel.value;
    var from = fFrom.value;
    var to = fTo.value;
    var search = fSearch.value.trim().toLowerCase();

    var list = operations.filter(function(o){
      if(type !== "all" && o.type !== type) return false;
      if(fuel !== "all" && o.fuel !== fuel) return false;
      if(from && o.date < from) return false;
      if(to && o.date > to) return false;
      if(search && o.party.toLowerCase().indexOf(search) === -1) return false;
      return true;
    });

    var field = sortState.field;
    var dir = sortState.dir === "asc" ? 1 : -1;
    list.sort(function(a,b){
      var av = a[field], bv = b[field];
      if(av < bv) return -1 * dir;
      if(av > bv) return 1 * dir;
      return 0;
    });

    return list;
  }

  function renderJournal(){
    var list = getFilteredSorted();
    journalBody.innerHTML = "";
    journalEmpty.style.display = list.length ? "none" : "block";

    list.forEach(function(o){
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td>' + isoToRu(o.date) + '</td>' +
        '<td><span class="tag ' + o.type + '">' + (o.type === "in" ? "Приход" : "Расход") + '</span></td>' +
        '<td><span class="fuel-tag ' + o.fuel + '">' + FUEL_LABEL[o.fuel] + '</span></td>' +
        '<td>' + fmtNum(o.volume) + '</td>' +
        '<td>' + escapeHtml(o.party) + '</td>' +
        '<td><button class="del-btn" data-id="' + o.id + '">Удалить</button></td>';
      journalBody.appendChild(tr);
    });

    journalBody.querySelectorAll(".del-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        if(!confirm("Удалить эту операцию из журнала?")) return;
        operations = operations.filter(function(o){ return o.id !== id; });
        saveOperations();
        renderTanks();
        renderJournal();
        renderDayReport();
      });
    });

    updateSortArrows();
  }

  function updateSortArrows(){
    document.getElementById("arrowDate").textContent = sortState.field === "date" ? (sortState.dir === "asc" ? "▲" : "▼") : "";
    document.getElementById("arrowVolume").textContent = sortState.field === "volume" ? (sortState.dir === "asc" ? "▲" : "▼") : "";
  }

  document.querySelectorAll("th.sortable").forEach(function(th){
    th.addEventListener("click", function(){
      var field = th.getAttribute("data-sort");
      if(sortState.field === field){
        sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
      }else{
        sortState.field = field;
        sortState.dir = "asc";
      }
      renderJournal();
    });
  });

  [fType, fFuel, fFrom, fTo].forEach(function(el){
    el.addEventListener("change", renderJournal);
  });
  fSearch.addEventListener("input", renderJournal);

  document.getElementById("fReset").addEventListener("click", function(){
    fType.value = "all";
    fFuel.value = "all";
    fFrom.value = "";
    fTo.value = "";
    fSearch.value = "";
    renderJournal();
  });

  // ---------- excel export ----------
  var exportFrom = document.getElementById("exportFrom");
  var exportTo = document.getElementById("exportTo");
  exportFrom.value = monthStartIso();
  exportTo.value = monthEndIso();

  document.getElementById("exportBtn").addEventListener("click", function(){
    var from = exportFrom.value;
    var to = exportTo.value;
    if(!from || !to || from > to){
      alert("Проверьте период: дата «с» должна быть не позже даты «по».");
      return;
    }
    buildExcelReport(from, to);
  });

  function opsInPeriod(type, from, to){
    return operations.filter(function(o){
      return o.type === type && o.date >= from && o.date <= to;
    }).sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  function buildSummaryByParty(list){
    // returns {rows:[{party, ai92, ai95, dt, total}], totals:{ai92,ai95,dt,total}}
    var map = {};
    var totals = {ai92:0, ai95:0, dt:0};
    list.forEach(function(o){
      if(!map[o.party]) map[o.party] = {ai92:0, ai95:0, dt:0};
      map[o.party][o.fuel] += o.volume;
      totals[o.fuel] += o.volume;
    });
    var rows = Object.keys(map).sort().map(function(party){
      var r = map[party];
      return {party:party, ai92:r.ai92, ai95:r.ai95, dt:r.dt, total:r.ai92+r.ai95+r.dt};
    });
    return {rows:rows, totals:{ai92:totals.ai92, ai95:totals.ai95, dt:totals.dt, total:totals.ai92+totals.ai95+totals.dt}};
  }

  function buildExcelReport(from, to){
    if(typeof XLSX === "undefined"){
      alert("Не удалось загрузить библиотеку для формирования Excel-файла. Проверьте подключение к интернету и повторите попытку.");
      return;
    }

    var ins = opsInPeriod("in", from, to);
    var outs = opsInPeriod("out", from, to);

    var wb = XLSX.utils.book_new();

    // Лист 1: Приход - операции
    var sheet1 = [["Дата","Вид НП","Объём, л","Поставщик / документ"]];
    ins.forEach(function(o){ sheet1.push([isoToRu(o.date), FUEL_LABEL[o.fuel], o.volume, o.party]); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet1), "Приход - операции");

    // Лист 2: Приход - по поставщикам
    var supp = buildSummaryByParty(ins);
    var sheet2 = [["Поставщик","АИ-92","АИ-95","ДТ","Итого"]];
    supp.rows.forEach(function(r){ sheet2.push([r.party, r.ai92, r.ai95, r.dt, r.total]); });
    sheet2.push(["Итого", supp.totals.ai92, supp.totals.ai95, supp.totals.dt, supp.totals.total]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet2), "Приход - по поставщикам");

    // Лист 3: Расход - операции
    var sheet3 = [["Дата","Вид НП","Объём, л","Объект назначения"]];
    outs.forEach(function(o){ sheet3.push([isoToRu(o.date), FUEL_LABEL[o.fuel], o.volume, o.party]); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet3), "Расход - операции");

    // Лист 4: Расход - по объектам
    var obj = buildSummaryByParty(outs);
    var sheet4 = [["Объект","АИ-92","АИ-95","ДТ","Итого"]];
    obj.rows.forEach(function(r){ sheet4.push([r.party, r.ai92, r.ai95, r.dt, r.total]); });
    sheet4.push(["Итого", obj.totals.ai92, obj.totals.ai95, obj.totals.dt, obj.totals.total]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet4), "Расход - по объектам");

    // Лист 5: Итоги
    var sheet5 = [["Вид НП","Остаток на начало периода, л","Приход за период, л","Расход за период, л","Остаток на конец периода, л"]];
    FUELS.forEach(function(f){
      var startStock = stockOf(f.key, from);
      var inSum = ins.filter(function(o){ return o.fuel === f.key; }).reduce(function(s,o){ return s+o.volume; }, 0);
      var outSum = outs.filter(function(o){ return o.fuel === f.key; }).reduce(function(s,o){ return s+o.volume; }, 0);
      var endStock = startStock + inSum - outSum;
      sheet5.push([f.label, startStock, inSum, outSum, endStock]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet5), "Итоги");

    var filename = "Отчет_ГСМ_" + isoToRu(from) + "-" + isoToRu(to) + ".xlsx";
    XLSX.writeFile(wb, filename);
  }

  // ---------- init ----------
  dayDateEl.value = todayIso();
  dayDateEl.addEventListener("change", renderDayReport);

  initForm("formIn", "in");
  initForm("formOut", "out");

  renderTanks();
  renderJournal();
  renderDayReport();
})();
</script>
</body>
</html>
